<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- WaveSurfer.js 7.12.11, BSD-3-Clause, vendored locally for offline-safe use. -->
  <script src="./vendor/wavesurfer-7.12.11.min.js"></script>
  <script src="./vendor/regions-7.12.11.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: transparent;
      color: #e5eef8;
      overflow: hidden;
    }
    .shell {
      width: 100%;
      min-width: 0;
      padding: 10px;
      border: 1px solid #22314d;
      border-radius: 10px;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      user-select: none;
      overflow: hidden;
    }
    #waveform {
      width: 100%;
      min-width: 0;
      min-height: 180px;
      border-radius: 8px;
      background: #0b1220;
      overflow: hidden;
      touch-action: pan-x pan-y;
    }
    #waveform ::part(region) {
      border: 2px solid rgba(74, 222, 128, 0.95);
      border-radius: 4px;
      touch-action: none;
    }
    #waveform ::part(region-handle) {
      width: 44px !important;
      min-width: 44px !important;
      opacity: 1;
      border-color: transparent !important;
      touch-action: none;
    }
    #waveform ::part(region-handle-left) {
      border-left: 4px solid #f8fafc !important;
    }
    #waveform ::part(region-handle-right) {
      border-right: 4px solid #f8fafc !important;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 8px;
    }
    .metric {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid #2d3d5f;
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.82);
    }
    .metric span {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.1;
    }
    .metric strong {
      display: block;
      margin-top: 3px;
      color: #f8fafc;
      font-size: 14px;
      line-height: 1.15;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .zoom-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(44px, 1fr));
      gap: 8px;
      max-width: 220px;
      margin: 8px 0 0 auto;
    }
    .zoom-controls button {
      min-width: 44px;
      padding: 0 10px;
    }
    button {
      min-height: 44px;
      border: 1px solid #3b4c6b;
      border-radius: 7px;
      background: #162238;
      color: #f8fafc;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #1f3150; }
    button:disabled { cursor: default; opacity: 0.48; }
    .message {
      display: none;
      margin-top: 7px;
      color: #fbbf24;
      font-size: 12px;
      line-height: 1.3;
    }
    @media (max-width: 430px) {
      .shell { padding: 8px; }
      #waveform { min-height: 158px; }
      .metric { padding: 6px; }
      .metric strong { font-size: 13px; }
    }
    body.join-compact .shell { padding: 8px; }
    body.join-compact #waveform { min-height: 118px; }
    body.join-compact .metric { padding: 5px 6px; }
    body.join-compact .controls { margin-top: 6px; }
    body.join-compact .zoom-controls { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div id="waveform" aria-label="Audio waveform selection"></div>
    <div class="zoom-controls" aria-label="Waveform zoom">
      <button id="zoomOutButton" type="button" title="Zoom out" aria-label="Zoom out" disabled>−</button>
      <button id="zoomResetButton" type="button" title="Fit waveform" aria-label="Fit waveform" disabled>Fit</button>
      <button id="zoomInButton" type="button" title="Zoom in" aria-label="Zoom in" disabled>+</button>
    </div>
    <div class="meta" aria-live="polite">
      <div class="metric"><span>Start</span><strong id="startLabel">00:00.000</strong></div>
      <div class="metric"><span>End</span><strong id="endLabel">00:01.000</strong></div>
      <div class="metric"><span>Length</span><strong id="durationLabel">00:01.000</strong></div>
    </div>
    <div class="controls">
      <button id="playButton" type="button">Play</button>
      <button id="selectionButton" type="button">Play Selection</button>
    </div>
    <div class="message" id="message" role="status"></div>
  </div>

  <script>
    const WAVE_SURFER_VERSION = "7.12.11";
    const waveformHost = document.getElementById("waveform");
    const startLabel = document.getElementById("startLabel");
    const endLabel = document.getElementById("endLabel");
    const durationLabel = document.getElementById("durationLabel");
    const playButton = document.getElementById("playButton");
    const selectionButton = document.getElementById("selectionButton");
    const zoomOutButton = document.getElementById("zoomOutButton");
    const zoomResetButton = document.getElementById("zoomResetButton");
    const zoomInButton = document.getElementById("zoomInButton");
    const message = document.getElementById("message");

    let wavesurfer = null;
    let regionsPlugin = null;
    let selectionRegion = null;
    let activeSourceId = "";
    let activeArgs = {};
    let interactionActive = false;
    let selectionPlayback = false;
    let selectionPreviewAudio = null;
    let activeSelectionPreviewId = "";
    let subscriptions = [];
    let previewSyncFrame = 0;
    let zoomIndex = 0;
    const zoomLevels = [0, 25, 50, 100, 200];
    const minGap = 0.1;

    function send(type, value) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...value}, "*");
    }

    function setComponentValue(value) {
      send("streamlit:setComponentValue", {value});
    }

    function setFrameHeight() {
      send("streamlit:setFrameHeight", {height: document.body.scrollHeight});
    }

    function componentReady() {
      send("streamlit:componentReady", {apiVersion: 1});
      setFrameHeight();
    }

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, Number(value) || 0));
    }

    function normalizedSelection(startValue, endValue, durationValue) {
      const duration = Math.max(minGap, Number(durationValue) || minGap);
      const start = clamp(startValue, 0, Math.max(0, duration - minGap));
      const end = clamp(endValue, start + minGap, duration);
      return {start, end};
    }

    function formatTime(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(value / 60);
      const remainder = value - minutes * 60;
      return `${String(minutes).padStart(2, "0")}:${remainder.toFixed(3).padStart(6, "0")}`;
    }

    function updateLabels(region = selectionRegion) {
      const start = Number(region?.start ?? activeArgs.start ?? 0);
      const end = Number(region?.end ?? activeArgs.end ?? Math.min(1, activeArgs.duration || 1));
      startLabel.textContent = formatTime(start);
      endLabel.textContent = formatTime(end);
      durationLabel.textContent = formatTime(Math.max(0, end - start));
    }

    function showMessage(text) {
      message.textContent = text || "";
      message.style.display = text ? "block" : "none";
      setFrameHeight();
    }

    function applyMode(mode) {
      document.body.classList.toggle("join-compact", mode === "join_compact");
    }

    function updatePlaybackButtons() {
      const ready = Boolean(wavesurfer && activeArgs.audio_url);
      const previewReady = !activeArgs.selection_preview_required || Boolean(selectionPreviewAudio && activeArgs.selection_preview_url);
      playButton.disabled = !ready;
      selectionButton.disabled = !ready || !selectionRegion || !previewReady;
      playButton.textContent = wavesurfer?.isPlaying() ? "Pause" : "Play";
      selectionButton.textContent = selectionPlayback ? "Pause Selection" : "Play Selection";
    }

    function updateZoomButtons() {
      const ready = Boolean(wavesurfer);
      zoomOutButton.disabled = !ready || zoomIndex <= 0;
      zoomResetButton.disabled = !ready || zoomIndex === 0;
      zoomInButton.disabled = !ready || zoomIndex >= zoomLevels.length - 1;
    }

    function applyZoom(nextIndex) {
      if (!wavesurfer) return;
      zoomIndex = Math.max(0, Math.min(zoomLevels.length - 1, Number(nextIndex) || 0));
      wavesurfer.zoom(zoomLevels[zoomIndex]);
      updateZoomButtons();
    }

    function stopPreviewSync() {
      if (previewSyncFrame) cancelAnimationFrame(previewSyncFrame);
      previewSyncFrame = 0;
    }

    function syncPreviewPlayhead() {
      stopPreviewSync();
      if (!selectionPlayback || !selectionPreviewAudio || selectionPreviewAudio.paused || !selectionRegion || !wavesurfer) return;
      wavesurfer.setTime(Math.min(selectionRegion.end, selectionRegion.start + selectionPreviewAudio.currentTime));
      previewSyncFrame = requestAnimationFrame(syncPreviewPlayhead);
    }

    function commitSelection(region) {
      if (!region || !activeSourceId) return;
      setComponentValue({
        start: Number(region.start.toFixed(3)),
        end: Number(region.end.toFixed(3)),
        source_id: activeSourceId,
        event: "selection_committed"
      });
    }

    function clearSubscriptions() {
      subscriptions.forEach((unsubscribe) => {
        try { unsubscribe(); } catch (_) {}
      });
      subscriptions = [];
    }

    function destroyWaveSurfer() {
      stopPreviewSync();
      clearSubscriptions();
      selectionRegion = null;
      regionsPlugin = null;
      selectionPlayback = false;
      if (selectionPreviewAudio) {
        try { selectionPreviewAudio.pause(); } catch (_) {}
        selectionPreviewAudio.removeAttribute("src");
        try { selectionPreviewAudio.load(); } catch (_) {}
      }
      selectionPreviewAudio = null;
      activeSelectionPreviewId = "";
      if (wavesurfer) {
        try { wavesurfer.pause(); } catch (_) {}
        try { wavesurfer.destroy(); } catch (_) {}
      }
      wavesurfer = null;
      zoomIndex = 0;
      waveformHost.replaceChildren();
      updatePlaybackButtons();
      updateZoomButtons();
    }

    function syncSelectionPreview(nextArgs) {
      const nextPreviewId = String(nextArgs.selection_preview_id || "");
      const nextPreviewUrl = String(nextArgs.selection_preview_url || "");
      if (nextPreviewId === activeSelectionPreviewId && Boolean(selectionPreviewAudio) === Boolean(nextPreviewUrl)) return;
      if (selectionPreviewAudio) {
        try { selectionPreviewAudio.pause(); } catch (_) {}
      }
      selectionPlayback = false;
      selectionPreviewAudio = null;
      activeSelectionPreviewId = nextPreviewId;
      if (nextPreviewUrl) {
        const preview = new Audio(nextPreviewUrl);
        preview.preload = "auto";
        preview.addEventListener("ended", () => {
          stopPreviewSync();
          if (wavesurfer && selectionRegion) wavesurfer.setTime(selectionRegion.end);
          selectionPlayback = false;
          updatePlaybackButtons();
        });
        preview.addEventListener("pause", () => {
          stopPreviewSync();
          if (!preview.ended) selectionPlayback = false;
          updatePlaybackButtons();
        });
        preview.addEventListener("error", () => {
          selectionPlayback = false;
          showMessage("Fade preview is unavailable. Selection and export still work.");
          updatePlaybackButtons();
        });
        selectionPreviewAudio = preview;
      }
      updatePlaybackButtons();
    }

    function addSelectionRegion() {
      if (!regionsPlugin || selectionRegion) return;
      if (!wavesurfer || wavesurfer.getDuration() <= 0) return;
      const selection = normalizedSelection(activeArgs.start, activeArgs.end, activeArgs.duration);
      selectionRegion = regionsPlugin.addRegion({
        id: "velaflow-selection",
        start: selection.start,
        end: selection.end,
        drag: true,
        resize: true,
        color: "rgba(34, 197, 94, 0.28)"
      });
      updateLabels();
      updatePlaybackButtons();
    }

    function initializeWaveSurfer(nextArgs) {
      destroyWaveSurfer();
      activeArgs = nextArgs;
      activeSourceId = String(nextArgs.source_id || "");
      syncSelectionPreview(nextArgs);
      applyMode(nextArgs.mode);
      showMessage("");

      if (!window.WaveSurfer?.create || !window.WaveSurfer?.Regions?.create) {
        showMessage("Waveform playback is unavailable. Start, end, and export still work.");
        updateLabels();
        return;
      }

      const points = Array.isArray(nextArgs.points)
        ? nextArgs.points.map((value) => clamp(Math.abs(Number(value) || 0), 0, 1))
        : [];
      try {
        wavesurfer = window.WaveSurfer.create({
          container: waveformHost,
          url: nextArgs.audio_url || undefined,
          peaks: points.length ? [points] : undefined,
          duration: Number(nextArgs.duration) || undefined,
          height: nextArgs.mode === "join_compact" ? 118 : (window.innerWidth <= 430 ? 158 : 180),
          waveColor: "#38bdf8",
          progressColor: "#0284c7",
          cursorColor: "#f8fafc",
          cursorWidth: 2,
          barWidth: 2,
          barGap: 1,
          barRadius: 2,
          normalize: false,
          interact: true,
          dragToSeek: false,
          hideScrollbar: true,
          autoScroll: false,
          autoCenter: false
        });
        regionsPlugin = wavesurfer.registerPlugin(window.WaveSurfer.Regions.create());

        subscriptions.push(regionsPlugin.on("region-update", (region) => {
          interactionActive = true;
          selectionRegion = region;
          updateLabels(region);
          // Active dragging stays browser-side; only the final region event is committed.
        }));
        subscriptions.push(regionsPlugin.on("region-updated", (region) => {
          if (selectionPlayback) {
            if (selectionPreviewAudio && !selectionPreviewAudio.paused) selectionPreviewAudio.pause();
            else wavesurfer.pause();
            selectionPlayback = false;
            stopPreviewSync();
          }
          interactionActive = false;
          selectionRegion = region;
          updateLabels(region);
          commitSelection(region);
        }));
        subscriptions.push(wavesurfer.on("ready", () => {
          addSelectionRegion();
          updatePlaybackButtons();
        }));
        subscriptions.push(wavesurfer.on("decode", () => addSelectionRegion()));
        subscriptions.push(wavesurfer.on("play", updatePlaybackButtons));
        subscriptions.push(wavesurfer.on("pause", () => {
          selectionPlayback = false;
          updatePlaybackButtons();
        }));
        subscriptions.push(wavesurfer.on("finish", () => {
          selectionPlayback = false;
          updatePlaybackButtons();
        }));
        subscriptions.push(wavesurfer.on("error", () => {
          showMessage("Playback is unavailable for this file. Selection and export still work.");
          updatePlaybackButtons();
        }));

        addSelectionRegion();
        updateLabels();
        updatePlaybackButtons();
        updateZoomButtons();
      } catch (_) {
        showMessage("Waveform playback is unavailable. Start, end, and export still work.");
        updateLabels();
      }
      setFrameHeight();
    }

    function syncCommittedSelection(nextArgs) {
      activeArgs = nextArgs;
      syncSelectionPreview(nextArgs);
      applyMode(nextArgs.mode);
      if (wavesurfer) wavesurfer.setOptions({height: nextArgs.mode === "join_compact" ? 118 : (window.innerWidth <= 430 ? 158 : 180)});
      if (!selectionRegion || interactionActive) return;
      const selection = normalizedSelection(nextArgs.start, nextArgs.end, nextArgs.duration);
      if (Math.abs(selectionRegion.start - selection.start) > 0.001 || Math.abs(selectionRegion.end - selection.end) > 0.001) {
        selectionRegion.setOptions({start: selection.start, end: selection.end});
        updateLabels(selectionRegion);
      }
    }

    playButton.addEventListener("click", async () => {
      if (!wavesurfer || !activeArgs.audio_url) return;
      selectionPlayback = false;
      if (selectionPreviewAudio) {
        try { selectionPreviewAudio.pause(); } catch (_) {}
      }
      try {
        if (!wavesurfer.isPlaying() && wavesurfer.getCurrentTime() >= wavesurfer.getDuration() - 0.05) {
          wavesurfer.setTime(0);
        }
        await wavesurfer.playPause();
        showMessage("");
      } catch (_) {
        showMessage("Tap Play again if Safari has paused audio access.");
      }
      updatePlaybackButtons();
    });

    selectionButton.addEventListener("click", async () => {
      if (!wavesurfer || !selectionRegion || !activeArgs.audio_url) return;
      try {
        if (selectionPlayback) {
          if (selectionPreviewAudio && !selectionPreviewAudio.paused) selectionPreviewAudio.pause();
          else wavesurfer.pause();
          selectionPlayback = false;
          stopPreviewSync();
          updatePlaybackButtons();
          return;
        }
        wavesurfer.pause();
        selectionPlayback = true;
        if (selectionPreviewAudio && activeArgs.selection_preview_url) {
          selectionPreviewAudio.currentTime = 0;
          wavesurfer.setTime(selectionRegion.start);
          await selectionPreviewAudio.play();
          syncPreviewPlayhead();
        } else {
          await wavesurfer.play(selectionRegion.start, selectionRegion.end);
        }
        showMessage("");
      } catch (_) {
        selectionPlayback = false;
        showMessage("Tap Play Selection again if Safari has paused audio access.");
      }
      updatePlaybackButtons();
    });

    zoomOutButton.addEventListener("click", () => applyZoom(zoomIndex - 1));
    zoomResetButton.addEventListener("click", () => applyZoom(0));
    zoomInButton.addEventListener("click", () => applyZoom(zoomIndex + 1));

    window.addEventListener("resize", () => {
      if (wavesurfer) wavesurfer.setOptions({height: activeArgs.mode === "join_compact" ? 118 : (window.innerWidth <= 430 ? 158 : 180)});
      setFrameHeight();
    });

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const nextArgs = event.data.args || {};
      const nextSourceId = String(nextArgs.source_id || "");
      if (!wavesurfer || nextSourceId !== activeSourceId) {
        initializeWaveSurfer(nextArgs);
      } else {
        syncCommittedSelection(nextArgs);
      }
      setFrameHeight();
    });

    componentReady();
  </script>
</body>
</html>
