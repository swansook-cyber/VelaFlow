name: Song Studio REA quality gate

on:
  pull_request:
    paths:
      - "app/main.py"
      - "core/**"
      - "tests/test_*rea.py"
      - ".github/workflows/song-studio-rea.yml"
  workflow_dispatch:

jobs:
  song-studio-rea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile affected modules
        run: |
          python -m py_compile core/thai_lyric_coherence.py core/song_title_engine.py core/suno_export.py app/main.py
      - name: REA regression suite
        run: |
          python -m pytest -q tests/test_thai_lyric_coherence_rea.py tests/test_song_studio_placeholder_titles_rea.py tests/test_song_studio_release_export_rea.py
